name: ios-unsigned
on:
  push:
    paths: ['.github/workflows/ios-unsigned.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npm ci --no-audit --no-fund
        working-directory: link
      - run: npx expo prebuild --platform ios --clean --no-install
        working-directory: mobile
        env: {CI: '1'}
      - run: pod install
        working-directory: mobile/ios
      - run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -json -workspace "$WS" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['workspace']['schemes'][0])")
          xcodebuild archive -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/DSBot.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -20
          mkdir -p build/Payload && cp -R build/DSBot.xcarchive/Products/Applications/*.app build/Payload/
          (cd build && zip -qry DS-Bot-unsigned.ipa Payload)
        working-directory: mobile
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned
          name: iOS unsigned build
          files: mobile/build/DS-Bot-unsigned.ipa
          make_latest: false
